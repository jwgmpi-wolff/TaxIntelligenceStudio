name: Release

# Publishes self-contained Windows builds so that scripts/Install.ps1 can
# install the application on a destination machine without compiling anything
# and without requiring the .NET SDK there.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Publish ${{ matrix.runtime }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TaxIntelligenceStudio.sln

      - name: Test
        run: dotnet test TaxIntelligenceStudio.sln --configuration Release --nologo

      - name: Publish
        run: >
          dotnet publish src/TaxIntelligenceStudio.Desktop
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output publish/${{ matrix.runtime }}
          --nologo
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -p:DebugType=none

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.runtime }}/TaxIntelligenceStudio.Desktop.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected '$exe' was not produced."
          }
          Write-Host "Published $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB executable."

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "publish/${{ matrix.runtime }}/*" `
            -DestinationPath "artifacts/TaxIntelligenceStudio-${{ matrix.runtime }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaxIntelligenceStudio-${{ matrix.runtime }}
          path: artifacts/TaxIntelligenceStudio-${{ matrix.runtime }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out installer scripts
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Package installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer/scripts -Force | Out-Null
          Copy-Item Install.cmd, Install-Local.cmd, Uninstall.cmd installer
          Copy-Item scripts/Install.ps1 installer/scripts
          Copy-Item .github/prompts/recreate-tax-intelligence-studio.prompt.md installer
          Compress-Archive -Path installer/* -DestinationPath artifacts/TaxIntelligenceStudio-Installer.zip
          Copy-Item .github/prompts/recreate-tax-intelligence-studio.prompt.md artifacts
          Get-ChildItem artifacts -File | Where-Object Name -ne SHA256SUMS.txt | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt

      - name: Publish completed release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/*.prompt.md
